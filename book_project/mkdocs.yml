site_name: Sustainable Agile Workflows in the Era of Generative AI
theme:
  name: material
  logo: assets/logo.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  icon:
    logo: material/book-open-page-variant
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlishbaFatima12/Book_Sustainable_Agile_Workflows
copyright: "Copyright &copy; 2025 SYEDA ALISHBA FATIMA"
nav:
