  - "Human-Sustainable Agile": "03-human-sustainable-agile.md"
  - "GenAI Agile Tools": "04-genai-agile-tools.md"
  - "Participatory Action Research": "05-participatory-action-research.md"
  - "AI-Enhanced Scrum": "06-ai-enhanced-scrum.md"
  - "Human Wellbeing in AI Workflows": "07-human-wellbeing-in-ai-workflows.md"
  - "Responsible AI in Agile": "08-responsible-ai-in-agile.md"
  - "Agentic DevOps": "09-agentic-devops.md"
  - "Future of Workflows": "10-future-of-workflows.md"
  - "Case Studies": "11-case-studies.md"
  - "Conclusion": "12-conclusion.md"
  - "Showcase": "showcase.md"
